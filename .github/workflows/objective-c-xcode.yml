name: React Native iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    env:
      TEAM_ID: 769D8U522H
      BUNDLE_ID: com.karins
      # Temporary runner keychain only — not an Apple secret. Keep non-empty.
      KEYCHAIN_PASSWORD: github-actions-keychain

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install CocoaPods
        run: |
          cd ios
          pod repo update
          pod install

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ] || [ -z "${P12_PASSWORD:-}" ]; then
            echo "::error::BUILD_CERTIFICATE_BASE64 or P12_PASSWORD secret is missing"
            exit 1
          fi
          if [ -z "${BUILD_PROVISION_PROFILE_BASE64:-}" ]; then
            echo "::error::BUILD_PROVISION_PROFILE_BASE64 secret is missing"
            exit 1
          fi

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          FIXED_CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate_fixed.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEY_PEM=$RUNNER_TEMP/dist.key.pem
          CERT_PEM=$RUNNER_TEMP/dist.cert.pem
          CA_PEM=$RUNNER_TEMP/dist.ca.pem

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          ls -la "$CERTIFICATE_PATH" "$PP_PATH"
          echo "P12 sha256: $(shasum -a 256 "$CERTIFICATE_PATH" | awk '{print $1}')"

          # Prove the secret actually contains a private key before touching the keychain.
          extract_p12() {
            local flag="${1:-}"
            openssl pkcs12 -in "$CERTIFICATE_PATH" -passin pass:"$P12_PASSWORD" \
              -nocerts -nodes $flag -out "$KEY_PEM" 2>/dev/null
            openssl pkcs12 -in "$CERTIFICATE_PATH" -passin pass:"$P12_PASSWORD" \
              -clcerts -nokeys $flag -out "$CERT_PEM" 2>/dev/null
            openssl pkcs12 -in "$CERTIFICATE_PATH" -passin pass:"$P12_PASSWORD" \
              -cacerts -nokeys $flag -out "$CA_PEM" 2>/dev/null || true
          }

          if ! extract_p12; then
            # Keychain-exported .p12 often needs OpenSSL legacy ciphers on runners.
            extract_p12 -legacy || true
          fi

          if ! grep -q "BEGIN.*PRIVATE KEY" "$KEY_PEM" 2>/dev/null; then
            echo "::error::GitHub secret .p12 has NO private key (or wrong P12_PASSWORD)."
            exit 1
          fi

          echo "=== Leaf certificate details ==="
          openssl x509 -in "$CERT_PEM" -noout -subject -issuer -dates
          openssl x509 -in "$CERT_PEM" -noout -ext extendedKeyUsage 2>/dev/null || true

          echo "Private key found in .p12 — repackaging for Apple Security import"
          openssl pkcs12 -export \
            -inkey "$KEY_PEM" \
            -in "$CERT_PEM" \
            -out "$FIXED_CERTIFICATE_PATH" \
            -passout pass:"$P12_PASSWORD" \
            -keypbe PBE-SHA1-3DES \
            -certpbe PBE-SHA1-3DES \
            -macalg sha1

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Keep login/system keychains in the search list. Replacing them with ONLY the
          # temp keychain makes Apple roots unavailable → "0 valid identities".
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed -e 's/"//g')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -s "$KEYCHAIN_PATH"

          # Install every common Apple WWDR/root so the leaf can chain-validate.
          mkdir -p "$RUNNER_TEMP/apple-certs"
          cd "$RUNNER_TEMP/apple-certs"
          for CER in \
            AppleWWDRCAG2.cer \
            AppleWWDRCAG3.cer \
            AppleWWDRCAG4.cer \
            AppleRootCA.cer \
            AppleRootCA-G2.cer \
            AppleRootCA-G3.cer
          do
            curl -fsLO "https://www.apple.com/certificateauthority/$CER" || true
            if [ -f "$CER" ]; then
              security import "$CER" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security || true
            fi
          done
          # Older WWDR host still used by some Distribution leaves.
          curl -fsLO https://developer.apple.com/certificationauthority/AppleWWDRCA.cer || true
          if [ -f AppleWWDRCA.cer ]; then
            security import AppleWWDRCA.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security || true
          fi

          # Import any CA bags that were inside the original .p12.
          if [ -s "$CA_PEM" ]; then
            security import "$CA_PEM" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security || true
          fi

          # Import identity (cert+key). Do not use -t cert — that can drop the private key link.
          IMPORT_OUT=$(security import "$FIXED_CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild 2>&1)
          echo "$IMPORT_OUT"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null

          echo "=== All codesigning identities (including invalid) ==="
          security find-identity -p codesigning "$KEYCHAIN_PATH" || true
          echo "=== Valid codesigning identities (search list) ==="
          security find-identity -v -p codesigning || true
          echo "=== Valid codesigning identities (temp keychain) ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

          # Prefer a valid identity from the full search list (uses System roots).
          IDENTITY=$(security find-identity -v -p codesigning \
            | grep -E 'Apple Distribution|iOS Distribution|iPhone Distribution' \
            | head -1 \
            | sed -E 's/.*"(.+)"/\1/')

          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | grep -E 'Apple Distribution|iOS Distribution|iPhone Distribution' \
              | head -1 \
              | sed -E 's/.*"(.+)"/\1/')
          fi

          if [ -z "$IDENTITY" ]; then
            echo "::error::Identity imported but not valid — usually missing WWDR chain or wrong cert type."
            openssl x509 -in "$CERT_PEM" -noout -subject -issuer -dates || true
            exit 1
          fi

          echo "CODE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Using identity: $IDENTITY"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $PROFILE_NAME ($UUID)"

          rm -f "$KEY_PEM" "$CERT_PEM" "$CA_PEM"

      - name: Archive App
        run: |
          set -euo pipefail
          mkdir -p build

          xcodebuild archive \
            -workspace ios/karins.xcworkspace \
            -scheme karins \
            -configuration Release \
            -archivePath build/karins.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            "CODE_SIGN_IDENTITY[sdk=iphoneos*]"="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER"

      - name: Create ExportOptions.plist
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>method</key>
          	<string>app-store</string>
          	<key>signingStyle</key>
          	<string>manual</string>
          	<key>teamID</key>
          	<string>${TEAM_ID}</string>
          	<key>provisioningProfiles</key>
          	<dict>
          		<key>${BUNDLE_ID}</key>
          		<string>${PROVISIONING_PROFILE_SPECIFIER}</string>
          	</dict>
          </dict>
          </plist>
          EOF
          sed -i '' 's/^[[:space:]]*//' ExportOptions.plist
          plutil -lint ExportOptions.plist

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/karins.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: karins-ipa
          path: build/*.ipa
