name: React Native iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    env:
      KEYCHAIN_PASSWORD: github
      TEAM_ID: 769D8U522H
      BUNDLE_ID: com.karins

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install CocoaPods
        run: |
          cd ios
          pod repo update
          pod install

      # Battle-tested keychain import — avoids flaky `security import` on CI runners.
      - name: Install Distribution Certificate
        uses: apple-actions/import-codesigning-certs@v5
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Resolve signing identity
        run: |
          set -euo pipefail

          echo "=== Codesigning identities ==="
          security find-identity -v -p codesigning

          IDENTITY=$(security find-identity -v -p codesigning \
            | grep -E 'Apple Distribution|iOS Distribution|iPhone Distribution' \
            | head -1 \
            | sed -E 's/.*"(.+)"/\1/')

          if [ -z "$IDENTITY" ]; then
            echo "::error::No Distribution identity after import."
            echo "GitHub secret BUILD_CERTIFICATE_BASE64 is still wrong or incomplete."
            echo "On your Mac you already have valid identities — export THAT .p12 from Keychain and replace the secret."
            echo "If CI still shows friendly name 'KARINS BITRISE DISTRIBUTION', the old Bitrise secret was not replaced."
            security find-identity -v -p codesigning || true
            exit 1
          fi

          echo "Using identity: $IDENTITY"
          echo "CODE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Install Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${BUILD_PROVISION_PROFILE_BASE64:-}" ]; then
            echo "::error::Secret BUILD_PROVISION_PROFILE_BASE64 is empty"
            exit 1
          fi

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # Strip whitespace/newlines — macOS `base64` wraps lines and breaks GitHub secrets.
          echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\n\r\t ' | base64 --decode > profile.mobileprovision

          security cms -D -i profile.mobileprovision > profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" profile.plist)

          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

          echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $PROFILE_NAME ($UUID)"

      - name: Archive App
        run: |
          set -euo pipefail
          mkdir -p build

          # Override both plain and sdk-specific identities — project.pbxproj still
          # has CODE_SIGN_IDENTITY[sdk=iphoneos*] = "iPhone Developer", which otherwise
          # wins and makes Xcode search for legacy "iOS Distribution".
          xcodebuild archive \
            -workspace ios/karins.xcworkspace \
            -scheme karins \
            -configuration Release \
            -archivePath build/karins.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            "CODE_SIGN_IDENTITY[sdk=iphoneos*]"="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER"

      - name: Create ExportOptions.plist
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>method</key>
          	<string>app-store</string>
          	<key>signingStyle</key>
          	<string>manual</string>
          	<key>teamID</key>
          	<string>${TEAM_ID}</string>
          	<key>provisioningProfiles</key>
          	<dict>
          		<key>${BUNDLE_ID}</key>
          		<string>${PROVISIONING_PROFILE_SPECIFIER}</string>
          	</dict>
          </dict>
          </plist>
          EOF
          sed -i '' 's/^[[:space:]]*//' ExportOptions.plist
          plutil -lint ExportOptions.plist

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/karins.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: karins-ipa
          path: build/*.ipa
