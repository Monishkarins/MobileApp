# Codemagic CI for KarinsFleet (React Native iOS)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-react-native-app/
#
# Before the first successful IPA:
# 1. In Codemagic UI → Code signing identities, upload iOS certificate + provisioning profile for com.karins
# 2. Or connect App Store Connect integration and let Codemagic manage signing

workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.karins
      vars:
        XCODE_WORKSPACE: "KarinsFleet.xcworkspace"
        XCODE_SCHEME: "KarinsFleet"
        BUNDLE_ID: "com.karins"
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles --warn-only

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
