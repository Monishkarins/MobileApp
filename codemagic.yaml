workflows:
  ios-workflow:
    name: iOS Build

    environment:
      xcode: latest
      cocoapods: default
      node: 20

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace ios/KarinsFleet.xcworkspace \
            --scheme KarinsFleet

    artifacts:
      - build/ios/ipa/*.ipa
