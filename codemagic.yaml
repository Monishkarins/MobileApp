# Codemagic CI for KarinsFleet (React Native iOS)
# Signing / App Store Connect can be added later when ready to export an IPA.

workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        XCODE_WORKSPACE: "KarinsFleet.xcworkspace"
        XCODE_SCHEME: "KarinsFleet"
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      # arm64 simulator only — mac_mini_m2 is Apple Silicon (x86_64 causes RNShare/native failures)
      - name: Build iOS app
        script: |
          xcodebuild \
            -workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/ios" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/ios/Build/Products/Release-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
