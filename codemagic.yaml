# Codemagic CI for KarinsFleet (React Native iOS)
# Signing / App Store Connect can be added later when ready to export an IPA.

workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        XCODE_WORKSPACE: "KarinsFleet.xcworkspace"
        XCODE_SCHEME: "KarinsFleet"
        # RN 0.86 prebuilt deps hide RCT-Folly; older pods like RNShare still require it
        RCT_USE_PREBUILT_RNCORE: "0"
        RCT_USE_RN_DEP: "0"
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      # Simulator build — no certificates or provisioning profiles required
      - name: Build iOS app
        script: |
          xcodebuild \
            -workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath "$CM_BUILD_DIR/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/ios/Build/Products/Release-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
