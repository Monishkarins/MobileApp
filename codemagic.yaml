# Codemagic CI/CD for KarinsFleet (React Native 0.86)
# iOS target: ios/karins.xcodeproj — scheme `karins`, bundle id `com.karins`
#
# Prerequisites in Codemagic UI:
# 1) Team settings > Integrations > App Store Connect — API key named below
# 2) Code signing identities — App Store distribution cert + profile for com.karins
# 3) Commit this file to the branch Codemagic builds

workflows:
  ios-release:
    name: iOS Release (TestFlight)
    max_build_duration: 120
    instance_type: mac_mini_m2

    # Uncomment after creating the App Store Connect API key integration in Codemagic.
    # integrations:
    #   app_store_connect: karins_ios_api_key

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.karins

      vars:
        XCODE_WORKSPACE: "karins.xcworkspace"
        XCODE_SCHEME: "karins"
        BUNDLE_ID: "com.karins"
        # Optional: App Store Connect Apple ID of the app (numeric). Enables auto build-number bump.
        # APP_STORE_APPLE_ID: "1234567890"

      node: 20
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "release/*"
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      # Limit signing to the app project — RN node_modules also contain .xcodeproj files.
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --project ios/karins.xcodeproj

      - name: Set build number
        script: |
          cd $CM_BUILD_DIR/ios
          # Prefer ASC latest+1 when APP_STORE_APPLE_ID + integration are configured; else Codemagic counter.
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo "0")
            agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))
          else
            # Codemagic built-in counter when App Store Connect bump is not configured
            agvtool new-version -all "$BUILD_NUMBER"
          fi

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

