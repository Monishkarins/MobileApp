workflows:
  ios-workflow:
    name: iOS Build

    environment:
      xcode: latest
      cocoapods: default
      node: 20

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install CocoaPods
  script: |
    cd ios
    echo "Current directory:"
    pwd

    echo "Before pod install:"
    ls -la

    pod install --repo-update

    echo "After pod install:"
    ls -la

    find . -name "*.xcworkspace"

    cd ..

      - name: Build iOS
  script: |
    echo "Listing ios directory"
    ls -la ios

    find ios -name "*.xcworkspace"

    xcode-project build-ipa \
      --workspace ios/KarinsFleet.xcworkspace \
      --scheme KarinsFleet

    artifacts:
      - build/ios/ipa/*.ipa
